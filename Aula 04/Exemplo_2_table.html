<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exemplo 2 - tabela</title>
	</head>
	<body>
		<table border="1" width="100%">
			<tr style="background-color:purple; color: white">
				<th>Cabeçalho 1</th>
				<th>Cabeçalho 2</th>
				<th>Cabeçalho 3</th>
			</tr>
			<tr>
				<td style="background-color:black;color:#FFF">Conteúdo 1</td>
				<td>
					<table border="1" width="100%">
						<tr>
							<td style="background-color: yellow;">1</td>
							<td style="background-color: red; color: white; text-align:right;">2</td>
						</tr>
						<tr>
							<td style="background-color: blue;  color: white; text-align:right;">3</td>
							<td style="background-color: #A2E3AF;">4</td>
						</tr>
					</table>
				</td>
				<td style="background-image:url('https://i.pinimg.com/474x/a4/74/fd/a474fdb574fd88ba05900ce6d39573db.jpg');" >conteúdo 3</td>
			</tr>
			<tr>
				<td style="background-color:black;color:#FFF">Conteúdo 4</td>
				<td style="background-image:url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTq4wJDhie7trttyc0rn_iT8Or2_5Mf-D8Ssy2nqT74Tw&s=10'); text-align:right;" >conteúdo 5</td>
				<td>
					<table border="1" width="100%">
						<tr>
							<td style="background-color: yellow; text-align:center;">5</td>
							<td style="background-color: pink;">6</td>
						</tr>
						<tr>
							<td style="background-color: red;text-align:right;">7</td>
							<td style="background-color: orange; text-align:center;">8</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>	
	</body>
</html>
