<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exemplo 4 - tabela</title>
	</head>
	<body>
		<table border="1" width="100%">
			<thead>
				<tr style="color: black">
					<th rowspan="3">Day</th>
					<th colspan="3">Seminar</th>
				</tr>
				<tr>
					<th colspan="2">Schedule</th>
					<th rowspan="2">Topic</th>
				</tr>
				<tr>
					<th>Begin</th>
					<th>End</th>
				</tr>
				<tr>
					<td rowspan="2">Monday</td>
					<td rowspan="2" style="background-color: yellow">8.00 m</td>
					<td rowspan="2" style="background-color: blue">5.00 m</td>
					<td>Introduction to XML</td>
				</tr>
				<tr>
					<td>Validity:DTD and Relax NG</td>
				</tr>
				<tr>
					<td rowspan="3"> Tuesday</td>
					<td style="background-color: yellow">8.00 m</td>
					<td style="background-color: yellow">11.00 m</td>
					<td rowspan="2">XPath</td>
				</tr>
				<tr>
					<td style="background-color: yellow">11.00 m</td>
					<td style="background-color: green">2.00 m</td>
				</tr>
				<tr>
					<td style="background-color: green">2.00 m</td>
					<td style="background-color: blue">5.00 m</td>
					<td>XSL Transformations</td>
				</tr>
				<tr>
					<td>Wednesday</td>
					<td style="background-color: yellow">8.00 m</td>
					<td style="background-color: green">12.00 m</td>
					<td>XSL Formatting Objetcs</td>
				</tr>
			</thead>
		</table>
	</body>
</html>
