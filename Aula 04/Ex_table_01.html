<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exemplo 1 - tabela</title>
	</head>
	<body>
		<!-- table tabela -->
		<!-- iniciando a tabela-->
		<table border="1" width="100%">
			<!--Thead -> table head -> cabeçalho da tabela-->
			<thead style="background-color: #C5C4C9; color: #FFF">
				<!--criando a primeira linha-->
				<!-- linha da tabela -> table row -> tr -->
				<tr>
					<th colspan="5" style="background-color: #5CBD8D">Tabela de Serviços Mecânicos</th>
				</tr>
			</thead>
			<!-- tbody -> table body -> corpo da tabela -->
			<tbody>
				<tr>
					<!-- th -> table head -> cabeçalho-->
					<th rowspan="5"style="background-color: green; color: #000">Nacionais</td>
					<th>Veiculos</th>
					<th>Serviço</th>
					<th>Tempo Previsto</th>
					<th>Valor</th>
				</tr>
				
				<tr>
					<!-- td -> table data -> dados da tabela -->
					
					<td>Caminhonete S10</td>
					<td>Suspensão</td>
					<td>3 horas e 25 minutos</td>
					<td>350,00</td>
					<!--criando a terceira linha -->
					<!-- linha da tabela -> table row -> tr -->
				</tr>	
					<tr>
						<td>Caminhonete Ranger</td>
						<td>Freio</td>
						<td>3 horas e 45 minutos</td>
						<td>200,00</td>
					</tr>
					<tr>
						<td>Caminhonete Hilux</td>
						<td>Troca de bateria</td>
						<td>30 minutos</td>
						<td>25,00</td>
					</tr>
					<!--criando sexta linha linha-->
					<tr>
						<td>Caminhonete D10</td>
						<td>Alinhamento</td>
						<td>1 hora e 40 minutos</td>
						<td>220,00</td>
					</tr>
			</tbody>
		</table>
	</body>
</html>
