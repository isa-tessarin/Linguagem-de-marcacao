<!DOCTYPE html> <!-- identificar o tipo de linguagem de programação-->
<html lang="pt-br"> <!-- o site está em portugues-->
<head> <!-- Orientar navegamento-->
	<meta charset="UTF-8"> <!-- para o site identificar teclado português-->
	<title>Exemplo</title> <!-- titulo do site-->
</head> <!-- fechar tag-->
<body> <!-- corpo do site-->
	<header> <!--representa uma seção introdutória ou um grupo de ajuda à navegação-->
	<h1>Título da Página</h1> <!--titulo da pagina-->
		<nav> <!--usada para criar blocos de links de navegação-->
		  <p>Home</p> <!-- paragrafo-->
		 </nav><!--fecha a tag-->
	</header><!--fecha tag-->
	<main> <!--efine o conteúdo principal e dominante do corpo de um documento ou aplicação-->
		<article> <!--representa uma composição autônoma e independente em uma página-->
		  <h2>artigo 1</h2><!--subtitulo-->
		  <p>Este é um artigo sobre... </p><!--paragrafo-->
		</article><!--fechar tag-->
		<article><!--representa uma composição autônoma e independente em uma página-->
		  <h2>Artigo 2</h2><!--subtitulo-->
		  <p>este é outro artigo sobre...</p><!--paragrafo-->
		</article><!--fechar tag-->
	</main><!--fechar tag-->
	<footer><!--define o rodapé de uma página ou de uma seção específica-->
		<p>&copy; 2024 Exemplo</p><!--define o rodapé de uma página ou de uma seção específica-->
	</footer><!--fechar tag--> 
</body><!--fechar tag-->
</html><!--fechar tag-->
